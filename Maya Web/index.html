<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Dra. Maya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desktop-layout">
        <aside class="sidebar">
            <div class="profile-section">
                <div class="profile-pic"></div>
                <div class="profile-info">
                    <span class="greeting">Painel de Gestão</span>
                    <h1 class="name">Dra. Maya Yamamoto</h1>
                </div>
            </div>

            <nav class="sidebar-menu">
                <h3 class="section-title">MENU PRINCIPAL</h3>
                <button class="menu-item active" id="btn-dashboard">
                    <span class="icon" style="color: #38b6ff;">🏠</span> Início
                </button>
                <button class="menu-item" id="btn-prontuarios">
                    <span class="icon" style="color: #2b9eb3;">🕒</span> Prontuários
                </button>
                <button class="menu-item" id="btn-exercicios">
                    <span class="icon" style="color: #4CAF50;">🏋️</span> Exercícios
                </button>
                <button class="menu-item" id="btn-agenda">
                    <span class="icon" style="color: #e27d60;">📅</span> Agenda
                </button>
                <button class="menu-item" id="btn-comunicados">
                    <span class="icon" style="color: #ffb400;">✉️</span> Comunicados
                </button>
            </nav>

            <button class="logout-btn" aria-label="Sair">⏻ Sair do Sistema</button>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <h2>Visão Geral da Clínica</h2>
                <div class="date-display">Terça-feira, 26 de Maio</div>
            </header>

            <section class="stats-row">
                <div class="status-card">
                    <h2 id="patient-count">0</h2>
                    <p>Pacientes ativos</p>
                </div>
                
                <div class="status-card secondary-card">
                    <h2 id="agenda-count">0</h2>
                    <p>Consultas marcadas</p>
                </div>
            </section>

            <section class="content-area" id="main-content">
                </section>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
